# picom: provides what Hyprland did natively (rounding, blur, shadow, dimming). Needs picom >= 10.
backend = "glx";
vsync = true;
use-damage = true;
corner-radius = 8;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "class_g = 'Polybar'" ];
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.45;
shadow-offset-x = -4;
shadow-offset-y = -4;
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "class_g = 'Polybar'", "_GTK_FRAME_EXTENTS@:c" ];
inactive-opacity = 0.95;
active-opacity = 1.0;
inactive-dim = 0.1;
focus-exclude = [ "class_g = 'Rofi'", "window_type = 'dock'" ];
opacity-rule = [ "100:class_g = 'mpv'", "100:class_g = 'vlc'", "100:fullscreen", "100:class_g = 'Rofi'" ];
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "_GTK_FRAME_EXTENTS@:c", "class_g = 'slop'" ];
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
wintypes:
{
  tooltip = { fade = true; shadow = false; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
};
