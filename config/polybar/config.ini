; Polybar - flat monochrome bar (i3). Colors: colors.ini
include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = ${env:BAR_HEIGHT:38}
fixed-center = true
enable-ipc = true
background = ${colors.background}
foreground = ${colors.foreground}
bottom = ${env:BAR_BOTTOM:false}
border-bottom-size = ${env:BORDER_BOTTOM:1}
border-top-size = ${env:BORDER_TOP:0}
border-bottom-color = ${colors.line}
border-top-color = ${colors.line}
padding-left = 0
; a little room after the power button in the Flat style (the block styles put it right at the edge: blocks.ini)
padding-right = 1
; the space around each item (Settings > Appearance > Bar > Space between blocks), from style.ini
module-margin = ${barstyle.gap}
; fonts are given in points at this fixed dpi, so they come out at exactly the pixel size launch.sh asks for
dpi = 96
; underline thickness (only the Underline style draws one) - style.ini is written for the chosen style at bar start
line-size = ${barstyle.line}
font-0 = ${env:BAR_FONT_SPEC:FantasqueSansM Nerd Font Mono:size=13.5;3}
font-1 = ${env:BAR_ICON_SPEC:FantasqueSansM Nerd Font Mono:size=16.5;4}
; the module lists come from launch.sh (Settings > Appearance > Bar can show the window title / what is playing)
modules-left = ${env:BAR_LEFT:i3}
modules-center =
modules-right = ${env:BAR_RIGHT:network bluetooth pulseaudio backlight caffeine nightlight battery cpu memory gpu date powermenu}
cursor-click = pointer
wm-restack = i3

; the system tray (Steam, Discord, nm-applet... whatever puts an icon there). It is a module like the others, so
; launch.sh puts it first in the right-hand list - on the left side of the items, next to Wi-Fi - on one monitor only
[module/tray]
type = internal/tray
tray-spacing = 6px
tray-padding = 2px
tray-size = 60%
tray-background = ${colors.background}

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
label-mode = %mode%
label-mode-padding = 2
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.primary}
label-focused = %name%
label-focused-foreground = ${barstyle.ws-fg}
label-focused-background = ${barstyle.ws-bg}
label-focused-underline = ${barstyle.ws-ul}
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-foreground = ${colors.disabled}
label-unfocused-padding = 2
label-visible = %name%
label-visible-foreground = ${colors.secondary}
label-visible-padding = 2
label-urgent = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.secondary}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.disabled}
label-padding = 2

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.primary}

[module/playerctl]
type = custom/script
exec = ~/.config/i3/scripts/PolybarPlayer.sh
interval = 2
click-left = playerctl play-pause
click-right = playerctl next
label = %output:0:40:...%
label-foreground = ${colors.secondary}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = 󰝟 muted
label-muted-foreground = ${colors.disabled}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
click-right = ~/.config/i3/scripts/SettingsGUI.py --tab sound

[module/backlight]
type = custom/script
exec = brightnessctl -m 2>/dev/null | awk -F, '{print "󰃟 " $4}'
interval = 5
scroll-up = ~/.config/i3/scripts/Brightness.sh --inc
scroll-down = ~/.config/i3/scripts/Brightness.sh --dec

[module/caffeine]
type = custom/script
exec = ~/.config/i3/scripts/Caffeine.sh status
interval = 2
click-left = ~/.config/i3/scripts/Caffeine.sh toggle
label-foreground = ${colors.secondary}

[module/nightlight]
type = custom/script
exec = ~/.config/i3/scripts/Nightlight.sh status
interval = 5
click-left = ~/.config/i3/scripts/Nightlight.sh toggle
label-foreground = ${colors.secondary}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 CPU "
format-prefix-foreground = ${colors.disabled}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = "󰍛 RAM "
format-prefix-foreground = ${colors.disabled}
label = %percentage_used:2%%

[module/gpu]
type = custom/script
exec = ~/.config/i3/scripts/PolybarGpu.sh
interval = 3
label = %output%

[module/bluetooth]
type = custom/script
exec = ~/.config/i3/scripts/PolybarBluetooth.sh
interval = 5
click-left = ~/.config/i3/scripts/BluetoothToggle.sh
click-right = ~/.config/i3/scripts/SettingsGUI.py --tab bluetooth

[module/network]
type = internal/network
interface-type = wireless
interval = 3
; (built-in modules ignore click-left: a click action tag opens the Wi-Fi tab of the settings window)
format-connected = %{A1:~/.config/i3/scripts/SettingsGUI.py --tab wifi:}<ramp-signal> <label-connected>%{A}
format-disconnected = %{A1:~/.config/i3/scripts/SettingsGUI.py --tab wifi:}<label-disconnected>%{A}
label-connected = %essid% %signal%%
label-disconnected = 󰖪
label-disconnected-foreground = ${colors.disabled}
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤨

[module/battery]
type = internal/battery
; the names differ per laptop (BAT0 / BAT1, AC / ADP1 / ACAD): launch.sh finds them in /sys/class/power_supply
battery = ${env:BAR_BATTERY:BAT0}
adapter = ${env:BAR_ADAPTER:AC}
full-at = 99
low-at = 15
format-charging = 󰂄 <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-low = 󰂃 <label-low>
label-low-foreground = ${colors.primary}
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹

[module/powermenu]
type = custom/text
format = %{T2}󰐥%{T-}
format-foreground = ${colors.primary}
click-left = ~/.config/i3/scripts/Powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = false

; the look of the chosen bar style (Settings > Appearance > Bar style), then the bar every style but Flat uses
include-file = ~/.config/polybar/style.ini
include-file = ~/.config/polybar/blocks.ini
