; Polybar - flat monochrome bar (i3). Colors: colors.ini
include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 30
fixed-center = true
enable-ipc = true
background = ${colors.background}
foreground = ${colors.foreground}
bottom = ${env:BAR_BOTTOM:false}
border-bottom-size = ${env:BORDER_BOTTOM:1}
border-top-size = ${env:BORDER_TOP:0}
border-bottom-color = ${colors.line}
border-top-color = ${colors.line}
padding-left = 0
padding-right = 2
module-margin = 1
font-0 = FantasqueSansM Nerd Font Mono:size=10;3
modules-left = i3 xwindow
modules-center =
modules-right = playerctl network bluetooth pulseaudio backlight nightlight battery cpu memory gpu date powermenu
tray-position = ${env:TRAY_POSITION:right}
tray-padding = 6
tray-background = ${colors.background}
cursor-click = pointer
wm-restack = i3

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
label-mode = %mode%
label-mode-padding = 2
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.primary}
label-focused = %name%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-foreground = ${colors.disabled}
label-unfocused-padding = 2
label-visible = %name%
label-visible-foreground = ${colors.secondary}
label-visible-padding = 2
label-urgent = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.secondary}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.disabled}
label-padding = 2

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.primary}

[module/playerctl]
type = custom/script
exec = ~/.config/i3/scripts/PolybarPlayer.sh
interval = 2
click-left = playerctl play-pause
click-right = playerctl next
label = %output:0:40:...%
label-foreground = ${colors.secondary}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = 󰝟 muted
label-muted-foreground = ${colors.disabled}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
click-right = pavucontrol

[module/backlight]
type = custom/script
exec = brightnessctl -m 2>/dev/null | awk -F, '{print "󰃟 " $4}'
interval = 5
scroll-up = ~/.config/i3/scripts/Brightness.sh --inc
scroll-down = ~/.config/i3/scripts/Brightness.sh --dec

[module/nightlight]
type = custom/script
exec = ~/.config/i3/scripts/Nightlight.sh status
interval = 5
click-left = ~/.config/i3/scripts/Nightlight.sh toggle
label-foreground = ${colors.secondary}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 CPU "
format-prefix-foreground = ${colors.disabled}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = "󰍛 RAM "
format-prefix-foreground = ${colors.disabled}
label = %percentage_used:2%%

[module/gpu]
type = custom/script
exec = ~/.config/i3/scripts/PolybarGpu.sh
interval = 3
label = %output%

[module/bluetooth]
type = custom/script
exec = ~/.config/i3/scripts/PolybarBluetooth.sh
interval = 5
click-left = ~/.config/i3/scripts/BluetoothToggle.sh
click-right = blueman-manager

[module/network]
type = internal/network
interface-type = wireless
interval = 3
format-connected = <ramp-signal> <label-connected>
label-connected = %essid% %signal%%
label-disconnected = 󰖪
label-disconnected-foreground = ${colors.disabled}
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤨
click-left = nm-connection-editor

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
low-at = 15
format-charging = 󰂄 <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-low = 󰂃 <label-low>
label-low-foreground = ${colors.primary}
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹

[module/powermenu]
type = custom/text
format = 󰐥
format-foreground = ${colors.primary}
click-left = ~/.config/i3/scripts/Powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = false
