; Bar style "blocks": every module sits in its own highlighted block; the blocks shade from dark to the
; accent colour (colors.ini seg1..seg13). Divider shapes and the bar style are picked in the Settings window
; (Appearance > Bar) and passed in by launch.sh. Generated - edit the generator, not this file, for big changes.

[bar/blocks]
inherit = bar/main
module-margin = 0
font-2 = ${env:BAR_CAP_SPEC:FantasqueSansM Nerd Font Mono:pixelsize=37;0}
modules-right = ${env:BAR_RIGHT_BLOCKS:b-network b-bluetooth b-pulseaudio b-backlight b-caffeine b-nightlight b-battery b-cpu b-memory b-gpu b-date b-powermenu}

[module/b-playerctl]
inherit = module/playerctl
format = " <label> "
format-background = ${colors.seg1}
format-foreground = ${colors.segfg1}
format-prefix = ${env:BAR_CAP_L:}
format-prefix-font = 3
format-prefix-foreground = ${colors.seg1}
format-prefix-background = ${colors.background}
format-suffix = ${env:BAR_CAP_R:}
format-suffix-font = 3
format-suffix-foreground = ${colors.seg1}
format-suffix-background = ${colors.background}
format-margin = ${env:BAR_BLOCK_GAP:1}
label-foreground = ${colors.segfg1}

[module/b-network]
inherit = module/network
format-connected = "%{A1:~/.config/i3/scripts/SettingsGUI.py --tab wifi:} <ramp-signal> <label-connected> %{A}"
format-connected-background = ${colors.seg2}
format-connected-foreground = ${colors.segfg2}
format-connected-prefix = ${env:BAR_CAP_L:}
format-connected-prefix-font = 3
