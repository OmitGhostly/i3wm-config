; The bar for every style except Flat (Settings > Appearance > Bar style). Each item's colours, end glyphs and
; spacing come from style.ini [barstyle], which the settings window writes for the chosen style when the bar
; starts. Written by tools/make_blocks.py in the repository: change that and run it, rather than editing this.

[bar/blocks]
inherit = bar/main
module-margin = 0
; the power button's block reaches the screen edge, like the workspace block on the left
padding-right = 0
font-2 = ${env:BAR_CAP_SPEC:FantasqueSansM Nerd Font Mono:size=27.277;5}
modules-right = ${env:BAR_RIGHT_B:b-network b-bluetooth b-pulseaudio b-backlight b-caffeine b-nightlight b-battery b-cpu b-memory b-gpu b-date b-powermenu}

[module/b-playerctl]
inherit = module/playerctl
format = " <label> "
format-background = ${barstyle.playerctl-bg}
format-foreground = ${barstyle.playerctl-fg}
format-underline = ${barstyle.playerctl-ul}
format-prefix = ${barstyle.playerctl-l}
format-prefix-font = 3
format-prefix-foreground = ${barstyle.playerctl-lfg}
format-prefix-background = ${barstyle.playerctl-lbg}
format-suffix = ${barstyle.playerctl-r}
format-suffix-font = 3
format-suffix-foreground = ${barstyle.playerctl-rfg}
format-suffix-background = ${barstyle.playerctl-rbg}
format-margin = ${barstyle.playerctl-gap}
format-offset = ${barstyle.playerctl-lead}
label-foreground = ${barstyle.playerctl-fg}

