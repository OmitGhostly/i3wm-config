<!-- Touchpad gestures for i3 (Settings > Mouse & touchpad > Touchpad gestures). Written by the settings
     window: three fingers left = next workspace, right = previous. Edits here are replaced on Apply. -->
<touchégg>
  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">20</property>
    <property name="color">auto</property>
    <property name="borderColor">auto</property>
  </settings>
  <application name="All">
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>~/.config/i3/scripts/Workspace.py next</command>
        <on>begin</on>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>~/.config/i3/scripts/Workspace.py prev</command>
        <on>begin</on>
      </action>
    </gesture>
  </application>
</touchégg>
